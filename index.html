<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presenze — ERODO OY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0F1117;
  --surface: #1A1D27;
  --surface2: #222534;
  --border: #2E3147;
  --border2: #3A3F5C;
  --text: #F0F1F8;
  --text2: #8B90B0;
  --text3: #555A7A;
  --accent: #4F6EF7;
  --accent2: #6B85FF;
  --success: #34C97B;
  --success-bg: rgba(52,201,123,0.1);
  --success-border: rgba(52,201,123,0.25);
  --danger: #F75F5F;
  --danger-bg: rgba(247,95,95,0.1);
  --danger-border: rgba(247,95,95,0.25);
  --warning: #F7A84F;
  --sans: 'Sora', sans-serif;
  --mono: 'JetBrains Mono', monospace;
}

body {
  font-family: var(--sans);
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 1rem 4rem;
  color: var(--text);
}

header { width: 100%; max-width: 440px; padding: 2.5rem 0 2rem; }
.brand { font-size: 10px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text3); font-family: var(--mono); margin-bottom: 8px; }
header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; color: var(--text); line-height: 1.1; }
header h1 span { color: var(--accent2); }

.block { width: 100%; max-width: 440px; margin-bottom: 12px; }
.block-label { font-size: 10px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text3); font-family: var(--mono); margin-bottom: 6px; padding-left: 2px; }

.input-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
input[type="text"] { width: 100%; padding: 15px 18px; background: transparent; border: none; font-size: 16px; font-family: var(--sans); font-weight: 400; color: var(--text); outline: none; -webkit-appearance: none; }
input[type="text"]::placeholder { color: var(--text3); }

.datetime-row { display: flex; align-items: center; justify-content: space-between; padding: 15px 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; }
.datetime-val { font-family: var(--mono); font-size: 14px; font-weight: 500; color: var(--text); letter-spacing: 0.02em; }
.datetime-day { font-size: 11px; color: var(--text3); font-family: var(--mono); }

.gps-row { display: flex; align-items: center; gap: 12px; padding: 15px 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--text3); }
.dot.acquiring { background: var(--warning); animation: blink 1.2s ease-in-out infinite; }
.dot.ok { background: var(--success); }
.dot.err { background: var(--danger); }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
.gps-info { flex: 1; min-width: 0; }
.gps-status { font-size: 13px; font-weight: 500; color: var(--text2); }
.gps-coords { font-family: var(--mono); font-size: 11px; color: var(--text3); margin-top: 2px; }
.maps-btn { font-size: 11px; font-family: var(--mono); color: var(--accent2); text-decoration: none; white-space: nowrap; flex-shrink: 0; display: none; }

.tipo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tipo-btn { padding: 18px 12px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--text2); cursor: pointer; transition: all 0.15s; text-align: center; line-height: 1.4; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.tipo-btn:hover { border-color: var(--border2); background: var(--surface2); color: var(--text); }
.tipo-icon { font-size: 20px; line-height: 1; }
.tipo-btn.entrata .tipo-icon { color: var(--success); }
.tipo-btn.inizio-pausa .tipo-icon { color: var(--warning); }
.tipo-btn.fine-pausa .tipo-icon { color: var(--accent2); }
.tipo-btn.uscita .tipo-icon { color: var(--danger); }
.tipo-btn.selected.entrata { border-color: var(--success); background: rgba(52,201,123,0.1); color: var(--success); }
.tipo-btn.selected.inizio-pausa { border-color: var(--warning); background: rgba(247,168,79,0.1); color: var(--warning); }
.tipo-btn.selected.fine-pausa { border-color: var(--accent2); background: rgba(107,133,255,0.1); color: var(--accent2); }
.tipo-btn.selected.uscita { border-color: var(--danger); background: rgba(247,95,95,0.1); color: var(--danger); }

.alert { width: 100%; max-width: 440px; padding: 14px 16px; border-radius: 12px; font-size: 13px; line-height: 1.5; display: none; margin-bottom: 10px; }
.alert.success { background: var(--success-bg); border: 1px solid var(--success-border); color: var(--success); }
.alert.error { background: var(--danger-bg); border: 1px solid var(--danger-border); color: var(--danger); }
.alert.show { display: block; }
.alert-title { font-weight: 600; margin-bottom: 2px; }

.submit-btn { width: 100%; max-width: 440px; padding: 16px; background: var(--accent); color: #fff; border: none; border-radius: 14px; font-family: var(--sans); font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.15s, transform 0.1s, opacity 0.15s; letter-spacing: -0.01em; margin-bottom: 10px; }
.submit-btn:hover { background: var(--accent2); }
.submit-btn:active { transform: scale(0.98); }
.submit-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

.spinner { display: none; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.submit-inner { display: flex; align-items: center; justify-content: center; gap: 8px; }

footer { font-size: 10px; color: var(--text3); text-align: center; margin-top: 8px; font-family: var(--mono); max-width: 440px; line-height: 1.8; }

@media (max-width: 360px) { .tipo-btn { padding: 14px 8px; font-size: 12px; } }
</style>
</head>
<body>

<header>
  <div class="brand">ERODO OY — Presenze</div>
  <h1>Registra la tua<br><span>timbratura</span></h1>
</header>

<div class="block">
  <div class="block-label">Nome e cognome</div>
  <div class="input-wrap">
    <input type="text" id="nome" placeholder="Es. Mario Rossi" autocomplete="name" autocapitalize="words">
  </div>
</div>

<div class="block">
  <div class="block-label">Data e ora</div>
  <div class="datetime-row">
    <span class="datetime-val" id="ora-display">—</span>
    <span class="datetime-day" id="data-display">—</span>
  </div>
</div>

<div class="block">
  <div class="block-label">Posizione GPS</div>
  <div class="gps-row">
    <div class="dot acquiring" id="gps-dot"></div>
    <div class="gps-info">
      <div class="gps-status" id="gps-status">Acquisizione in corso…</div>
      <div class="gps-coords" id="gps-coords"></div>
    </div>
    <a href="#" class="maps-btn" id="maps-link" target="_blank">↗ Maps</a>
  </div>
</div>

<div class="block">
  <div class="block-label">Tipo timbratura</div>
  <div class="tipo-grid">
    <button class="tipo-btn entrata" data-tipo="Entrata" onclick="selectTipo(this)">
      <span class="tipo-icon">▶</span>Entrata
    </button>
    <button class="tipo-btn inizio-pausa" data-tipo="Inizio pausa" onclick="selectTipo(this)">
      <span class="tipo-icon">⏸</span>Inizio pausa
    </button>
    <button class="tipo-btn fine-pausa" data-tipo="Fine pausa" onclick="selectTipo(this)">
      <span class="tipo-icon">▶▶</span>Fine pausa
    </button>
    <button class="tipo-btn uscita" data-tipo="Uscita" onclick="selectTipo(this)">
      <span class="tipo-icon">⏹</span>Uscita
    </button>
  </div>
</div>

<div class="alert" id="alert-box">
  <div class="alert-title" id="alert-title"></div>
  <div id="alert-msg"></div>
</div>

<button class="submit-btn" id="submit-btn" onclick="invia()">
  <div class="submit-inner">
    <div class="spinner" id="spinner"></div>
    <span id="btn-label">Invia timbratura</span>
  </div>
</button>

<footer>
  I dati vengono registrati in tempo reale · ERODO OY
</footer>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzM1pluEIvH9y5RkKLEOT8sTSwfGe1FDLTle-5QHjfCsv7RP93-uD5Xvvf_keCIF4hw5Q/exec";

  let lat = null, lon = null, acc = null;
  let tipoSelezionato = null;

  function getOrCreateDeviceId() {
    let id = localStorage.getItem("erodo_device_id");
    if (!id) {
      const entropy = [navigator.userAgent, navigator.language, screen.width + "x" + screen.height, screen.colorDepth, new Date().getTimezoneOffset(), navigator.hardwareConcurrency || 0, Math.random().toString(36).slice(2)].join("|");
      let hash = 0;
      for (let i = 0; i < entropy.length; i++) { hash = ((hash << 5) - hash) + entropy.charCodeAt(i); hash |= 0; }
      id = Math.abs(hash).toString(36).padStart(8,"0") + "-" + Date.now().toString(36).slice(-4);
      localStorage.setItem("erodo_device_id", id);
      localStorage.setItem("erodo_device_first_seen", new Date().toISOString());
    }
    return id;
  }

  function getDeviceInfo() {
    const ua = navigator.userAgent;
    let os = "Sconosciuto", browser = "Sconosciuto", tipo = "Desktop";
    if (/iPhone|iPad|iPod/.test(ua)) { os = /iPad/.test(ua) ? "iPadOS" : "iOS"; tipo = /iPad/.test(ua) ? "Tablet" : "Mobile"; }
    else if (/Android/.test(ua)) { os = "Android"; tipo = "Mobile"; }
    else if (/Windows/.test(ua)) os = "Windows";
    else if (/Mac OS X/.test(ua)) os = "macOS";
    else if (/Linux/.test(ua)) os = "Linux";
    if (/CriOS/.test(ua)) browser = "Chrome (iOS)";
    else if (/FxiOS/.test(ua)) browser = "Firefox (iOS)";
    else if (/SamsungBrowser/.test(ua)) browser = "Samsung Browser";
    else if (/EdgA|Edg/.test(ua)) browser = "Edge";
    else if (/Chrome/.test(ua) && !/Chromium/.test(ua)) browser = "Chrome";
    else if (/Safari/.test(ua) && !/Chrome/.test(ua)) browser = "Safari";
    else if (/Firefox/.test(ua)) browser = "Firefox";
    return { os, browser, tipo };
  }

  const deviceId = getOrCreateDeviceId();
  const deviceInfo = getDeviceInfo();
  const firstSeen = localStorage.getItem("erodo_device_first_seen") || new Date().toISOString();

  function aggiornaOra() {
    const now = new Date();
    const giorni = ["Dom","Lun","Mar","Mer","Gio","Ven","Sab"];
    const mesi = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
    document.getElementById("ora-display").textContent = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
    document.getElementById("data-display").textContent = `${giorni[now.getDay()]} ${now.getDate()} ${mesi[now.getMonth()]} ${now.getFullYear()}`;
  }
  aggiornaOra();
  setInterval(aggiornaOra, 1000);

  if (navigator.geolocation) {
    navigator.geolocation.watchPosition(
      function(pos) {
        lat = pos.coords.latitude.toFixed(6);
        lon = pos.coords.longitude.toFixed(6);
        acc = Math.round(pos.coords.accuracy);
        document.getElementById("gps-dot").className = "dot ok";
        document.getElementById("gps-status").textContent = `Posizione acquisita (±${acc}m)`;
        document.getElementById("gps-coords").textContent = `${lat}, ${lon}`;
        const link = document.getElementById("maps-link");
        link.href = `https://maps.google.com/?q=${lat},${lon}`;
        link.style.display = "block";
      },
      function(err) {
        document.getElementById("gps-dot").className = "dot err";
        let msg = "GPS non disponibile";
        if (err.code === 1) msg = "Permesso GPS negato";
        else if (err.code === 3) msg = "Timeout GPS";
        document.getElementById("gps-status").textContent = msg;
      },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
    );
  } else {
    document.getElementById("gps-dot").className = "dot err";
    document.getElementById("gps-status").textContent = "GPS non supportato";
  }

  function selectTipo(btn) {
    document.querySelectorAll(".tipo-btn").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
    tipoSelezionato = btn.dataset.tipo;
  }

  function showAlert(tipo, title, msg) {
    const box = document.getElementById("alert-box");
    box.className = `alert ${tipo} show`;
    document.getElementById("alert-title").textContent = title;
    document.getElementById("alert-msg").textContent = msg;
    box.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function hideAlert() { document.getElementById("alert-box").className = "alert"; }

  async function invia() {
    hideAlert();
    const nome = document.getElementById("nome").value.trim();
    if (!nome) { showAlert("error", "Campo obbligatorio", "Inserisci nome e cognome prima di procedere."); document.getElementById("nome").focus(); return; }
    if (!tipoSelezionato) { showAlert("error", "Tipo mancante", "Seleziona il tipo di timbratura."); return; }
    if (!lat || !lon) { showAlert("error", "GPS non pronto", "Attendi l'acquisizione della posizione GPS prima di inviare."); return; }

    const btn = document.getElementById("submit-btn");
    btn.disabled = true;
    document.getElementById("spinner").style.display = "block";
    document.getElementById("btn-label").textContent = "Invio in corso…";

    const now = new Date();
    const params = new URLSearchParams({
      nome: nome,
      tipo: tipoSelezionato,
      data: now.toLocaleDateString("it-IT"),
      ora: now.toLocaleTimeString("it-IT"),
      timestamp: now.toISOString(),
      lat: lat,
      lon: lon,
      accuratezza: acc + "m",
      maps: "https://maps.google.com/?q=" + lat + "," + lon,
      device_id: deviceId,
      device_tipo: deviceInfo.tipo,
      device_os: deviceInfo.os,
      device_browser: deviceInfo.browser,
      device_first_seen: firstSeen
    });

    try {
      const response = await fetch(SCRIPT_URL + "?" + params.toString(), { mode: "no-cors" });
      if (response.ok || response.type === "opaque") {
        showAlert("success", "Timbratura registrata", `${tipoSelezionato} di ${nome} salvata alle ${now.toLocaleTimeString("it-IT")}.`);
        document.getElementById("nome").value = "";
        document.querySelectorAll(".tipo-btn").forEach(b => b.classList.remove("selected"));
        tipoSelezionato = null;
      } else {
        throw new Error("Errore server");
      }
    } catch (err) {
      showAlert("error", "Errore di invio", "Non è stato possibile salvare la timbratura. Controlla la connessione e riprova.");
    } finally {
      btn.disabled = false;
      document.getElementById("spinner").style.display = "none";
      document.getElementById("btn-label").textContent = "Invia timbratura";
    }
  }
</script>
</body>
</html>
